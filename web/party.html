<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラオケ.ロデオ — パーティー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<style>
  main.page { max-width: 520px; }
  .code { font-family: var(--font-led); font-size: 30px; letter-spacing: 4px; color: var(--cyan); }
  .big { width: 100%; padding: 16px; font-size: 20px; border-radius: 16px; }
  .big.on { background: var(--gold); border-color: var(--gold); color: #1a1400; box-shadow: 0 0 18px rgba(255, 198, 75, .4); }
  .now { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel-2); border-radius: 12px;
         border-left: 5px solid var(--seat, var(--line)); }
  .list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border: none; } .list ul { list-style: none; margin: 0; padding: 0; }
  .list .s { margin-left: auto; font-family: var(--font-led); color: var(--gold); font-size: 18px; }
  .seat { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--seat, var(--line)); box-shadow: 0 0 7px var(--seat, transparent); }
  input[type=text], input[type=email] { font-size: 18px; padding: 12px 14px; width: 100%; }
  /* two ways in: a nickname, or an account — neither should feel like the long way round */
  .ways { display: grid; gap: 10px; }
  .way { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .way h3 { margin: 0; color: var(--ink); font-size: 14px; letter-spacing: 0; }
  .way .why { color: var(--ink-dim); font-size: 12px; line-height: 1.55; margin: 0; }
  .or { text-align: center; color: var(--ink-mute); font-size: 12px; }
  .devlink { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<header class="top"></header>
<main class="page stack" style="gap:14px">
  <div class="panel row spread"><div><div class="dim" style="font-size:12px">パーティー <span class="sub">party</span></div><div class="code" id="code"></div></div><div id="status" class="dim"></div></div>

  <section class="panel stack" id="join" hidden>
    <h2>参加する <span class="sub">join</span></h2>
    <div class="ways">
      <div class="way" id="wayMe" hidden>
        <h3 id="meName"></h3>
        <p class="why">このアカウントで参加します。点数はあなたの記録・ランキングに残ります。</p>
        <button class="primary big" id="joinMe">この名前で参加 <span class="sub">join</span></button>
      </div>
      <div class="way" id="wayAccount">
        <h3>アカウントで参加</h3>
        <p class="why">点数が自分の記録として残り、上達グラフとランキングに入ります。パスワードはありません — メールに届くリンクを開くだけで、この画面に戻ってきます。</p>
        <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        <button class="primary big" id="sendLink">ログインリンクを送る <span class="sub">send login link</span></button>
        <div id="mailOut" class="stack"></div>
      </div>
      <div class="or">— または —</div>
      <div class="way" id="wayGuest">
        <h3>ゲストで参加</h3>
        <p class="why">ニックネームだけですぐ歌えます。点数はこのパーティーの中だけに残ります（あとでログインすれば引き継げます）。</p>
        <input id="name" type="text" maxlength="20" placeholder="ニックネーム">
        <button class="big" id="joinBtn">ゲストで参加 <span class="sub">join as guest</span></button>
      </div>
    </div>
  </section>

  <section class="panel stack" id="in" hidden>
    <div class="now" id="now"></div>
    <button class="big" id="nextBtn">次うたいたい！ <span class="sub">I'm next</span></button>
    <div class="dim" id="me" style="font-size:12px"></div>
  </section>
  <section class="panel list">
    <h3>参加者 <span class="sub">players</span></h3>
    <ul id="members"></ul>
  </section>
  <section class="panel list">
    <h3>このパーティーの記録 <span class="sub">tonight</span></h3>
    <ul id="plays"></ul>
  </section>
</main>
<script type="module">
  import { api, renderNav, getMe, el, $, avatarEl, fmtScore, toast } from '/static/common.js';
  const code = location.pathname.split('/').pop().toUpperCase();
  await renderNav('');
  const me = await getMe();
  $('code').textContent = code;
  let p = null;

  async function load() {
    try { p = await api(`/api/party/${code}`); } catch (e) { $('status').textContent = e.message; return; }
    render();
  }
  function render() {
    const mine = p.members.find((m) => m.id === p.me_member_id);
    $('status').textContent = p.ended ? '終了しました' : `${p.members.length}人`;
    $('join').hidden = !!mine || p.ended;
    $('in').hidden = !mine;
    // Logged in? one tap. Not logged in? the account path and the guest path, side by side.
    $('wayMe').hidden = !me;
    $('wayAccount').hidden = !!me;
    if (me) { $('meName').textContent = `${me.display_name} として参加`; }
    if (mine) {
      const cur = p.members.find((m) => m.id === p.current_member_id);
      $('now').style.setProperty('--seat', cur ? cur.color : 'transparent');
      $('now').replaceChildren(cur ? avatarEl(cur, 'lg') : '', el('div', {},
        el('div', { class: 'dim', style: 'font-size:12px' }, 'いま歌っているのは'),
        el('b', { style: 'font-size:18px' }, cur ? cur.name : '—')));
      $('nextBtn').className = 'big' + (mine.queue_pos != null ? ' on' : '');
      $('nextBtn').textContent = mine.queue_pos != null
        ? `順番待ち ${p.members.filter((m) => m.queue_pos != null && m.queue_pos <= mine.queue_pos).length}番目（タップで取り消し）`
        : '次うたいたい！';
      $('me').replaceChildren(el('i', { class: 'seat', style: `--seat:${mine.color}` }), ` あなた: ${mine.name}` + (mine.is_guest ? '（ゲスト）' : ''));
      $('me').style.display = 'flex'; $('me').style.alignItems = 'center'; $('me').style.gap = '6px';
    }
    $('members').replaceChildren(...p.members.map((m) => el('li', {},
      el('i', { class: 'seat', style: `--seat:${m.color}` }), avatarEl(m),
      el('span', {}, m.name, m.id === p.current_member_id ? ' 🎤' : '', m.queue_pos != null ? el('span', { class: 'pink' }, ` 次${m.queue_pos}`) : ''),
      m.best != null ? el('span', { class: 's' }, fmtScore(m.best)) : '')));
  }
  async function loadBoard() {
    try {
      const b = await api(`/api/party/${code}/board`);
      $('plays').replaceChildren(...b.plays.slice(0, 30).map((r) => el('li', {}, avatarEl(r), el('span', {}, el('b', {}, r.name), ' ', el('span', { class: 'dim' }, r.title_jp)), el('span', { class: 's' }, fmtScore(r.score)))));
      if (!b.plays.length) $('plays').append(el('li', { class: 'mute' }, 'まだ記録なし'));
    } catch (e) { /* ignore */ }
  }

  async function join(body) {
    try { p = await api(`/api/party/${code}/join`, { method: 'POST', body }); await load(); }
    catch (e) { toast(e.message, 'err'); }
  }
  $('joinBtn').onclick = () => join({ name: $('name').value });
  $('joinMe').onclick = () => join({});
  $('name').onkeydown = (e) => { if (e.key === 'Enter') $('joinBtn').click(); };
  $('email').onkeydown = (e) => { if (e.key === 'Enter') $('sendLink').click(); };

  // Magic link requested right here: the link comes back to this party page, which then joins automatically.
  $('sendLink').onclick = async () => {
    const email = $('email').value.trim();
    if (!email) { $('email').focus(); return; }
    $('sendLink').disabled = true;
    $('mailOut').replaceChildren();
    try {
      const r = await api('/api/auth/request', { method: 'POST', body: { email, next: `/p/${code}` } });
      $('mailOut').append(el('div', { class: 'msg ok' }, `${email} にリンクを送りました（15分有効）。開くとこの画面に戻って参加できます。`));
      if (r.dev_link) $('mailOut').append(el('div', { class: 'msg' }, el('b', {}, 'DEV MODE: '), el('a', { class: 'devlink', href: r.dev_link }, r.dev_link)));
    } catch (err) {
      $('mailOut').append(el('div', { class: 'msg err' }, err.message));
    }
    $('sendLink').disabled = false;
  };
  $('nextBtn').onclick = async () => { try { p = await api(`/api/party/${code}/next`, { method: 'POST' }); render(); } catch (e) { toast(e.message, 'err'); } };

  await load();
  // A logged-in visitor who is not seated yet takes their seat straight away (claiming their guest seat if they had one).
  if (me && p && !p.me_member_id) await join({});
  await loadBoard();
  setInterval(load, 4000);
  setInterval(loadBoard, 8000);
</script>
</body>
</html>
