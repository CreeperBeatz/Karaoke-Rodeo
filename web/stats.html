<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラオケ.ロデオ — きろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0b0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カラオケ.ロデオ">
<link rel="stylesheet" href="/static/common.css">
<style>
  .sec { margin-top: 18px; }
  .songtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .songtabs button { border-radius: 999px; font-size: 12px; padding: 5px 11px; }
  .songtabs button.on { border-color: var(--cyan); color: var(--cyan); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .weaklist li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .weaklist ul { list-style: none; margin: 8px 0 0; padding: 0; } .weaklist li:last-child { border: none; }
  .pct { font-family: var(--font-led); font-size: 16px; min-width: 48px; }
  .calwrap { overflow-x: auto; padding-bottom: 4px; }
  .legend { display: flex; gap: 8px; align-items: center; color: var(--ink-dim); font-size: 11px; margin-top: 8px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  td.sc { font-family: var(--font-led); color: var(--gold); font-size: 16px; }
</style>
</head>
<body>
<header class="top"></header>
<main class="page">
  <h1>きろく <span class="sub">your stats</span></h1>
  <div class="tiles" id="tiles"></div>

  <section class="sec panel">
    <h3>練習カレンダー <span class="sub">practice calendar</span></h3>
    <div class="calwrap"><div class="cal" id="cal"></div></div>
    <div class="legend">少ない <i style="background:var(--panel-2)"></i><i class="l1" style="background:#145c6a"></i><i style="background:#1f93aa"></i><i style="background:#35d6f0"></i> 多い　<span id="calNote"></span></div>
  </section>

  <section class="sec">
    <div class="songtabs" id="songtabs"></div>
    <div class="two">
      <div class="panel"><h3>点数の推移 <span class="sub">score trend</span></h3><div class="chart" id="trend"></div></div>
      <div class="panel weaklist"><h3>にがてな区間 <span class="sub">weak sections</span></h3>
        <div class="dim" style="font-size:12px">直近5回の区間ごとの命中率。暗い＝にがて。</div>
        <div class="heat" id="heat" style="margin-top:8px"></div>
        <ul id="weak"></ul></div>
    </div>
  </section>

  <section class="sec panel">
    <h3>音ごとの正確さ <span class="sub">pitch accuracy by note</span></h3>
    <div class="dim" style="font-size:12px">全曲・全回。棒＝その音を当てた割合。↑は高め（シャープ）、↓は低め（フラット）に外しがち。</div>
    <div class="chart" id="notes"></div>
  </section>

  <section class="sec panel tablewrap">
    <h3>最近の記録 <span class="sub">recent plays</span></h3>
    <table id="recent"></table>
  </section>
</main>
<div id="tip" class="tooltip" hidden></div>
<script type="module">
  import { api, renderNav, requireLogin, el, $, fmtScore, fmtDate, fmtAgo } from '/static/common.js';
  await renderNav('/stats');
  await requireLogin();
  const D = await api(`/api/me/stats?tz=${new Date().getTimezoneOffset()}`);
  const S = D.summary;
  const tip = $('tip');
  const showTip = (e, html) => { tip.innerHTML = html; tip.hidden = false; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; };
  const hideTip = () => (tip.hidden = true);

  // --- tiles ---
  const tile = (label, value, note, cls = '') => el('div', { class: 'tile' }, el('div', { class: 'label' }, label), el('div', { class: `value ${cls}` }, value), note ? el('div', { class: 'note' }, note) : null);
  $('tiles').replaceChildren(
    tile('うたった回数', S.n_plays, `${S.n_songs}曲`),
    tile('平均ベスト', S.avg_best != null ? fmtScore(S.avg_best) : '--', '曲ごとの自己ベストの平均'),
    tile('最高得点', S.best ? fmtScore(S.best.score) : '--', S.best ? S.best.title_jp : ''),
    tile('連続日数', `${S.streak}日`, `最長 ${S.longest_streak}日`, 'cyan'),
    tile('練習した日', `${S.days_practiced}日`, ''));

  // --- calendar (last 20 weeks, columns = weeks, rows = Sun..Sat) ---
  const today = new Date(D.calendar.today + 'T00:00:00');
  const start = new Date(today); start.setDate(start.getDate() - start.getDay() - 7 * 19);
  const cells = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const k = d.toISOString().slice(0, 10), n = D.calendar.days[k] || 0;
    const c = el('i', { class: (n >= 6 ? 'l3' : n >= 3 ? 'l2' : n >= 1 ? 'l1' : '') + (k === D.calendar.today ? ' today' : ''), title: `${k}: ${n}回` });
    cells.push(c);
  }
  // pad so the first column starts on Sunday
  for (let i = 0; i < start.getDay(); i++) cells.unshift(el('i', { style: 'visibility:hidden' }));
  $('cal').replaceChildren(...cells);
  $('calNote').textContent = S.n_plays ? '' : 'まだ記録がありません。1曲うたうと色がつきます。';

  // --- per-song section ---
  const songs = D.songs;
  let cur = songs[0]?.song_id;
  function tabs() { $('songtabs').replaceChildren(...songs.map((s) => el('button', { class: cur === s.song_id ? 'on' : '', onclick: () => { cur = s.song_id; tabs(); drawSong(); } }, s.title_jp, ' ', el('span', { class: 'led gold', style: 'font-size:11px' }, fmtScore(s.best))))); }
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

  function trendChart(s) {
    const W = 520, H = 220, L = 42, R = 14, T = 14, B = 30;
    const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '点数の推移' });
    const pts = s.trend.map(([d, sc]) => ({ t: new Date(d).getTime(), sc }));
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = Math.max(t1 - t0, 3600e3);
    const lo = Math.max(0, Math.floor((Math.min(...pts.map((p) => p.sc)) - 5) / 10) * 10), hi = 100;
    const X = (t) => pts.length === 1 ? (L + W - R) / 2 : L + ((t - t0) / span) * (W - L - R);
    const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const g = svg('g', { class: 'grid' }), ax = svg('g', { class: 'axis' });
    for (let v = lo; v <= hi; v += (hi - lo) / 5) {
      g.append(svg('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v) }));
      const tx = svg('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }); tx.textContent = Math.round(v); ax.append(tx);
    }
    const d0 = svg('text', { x: L, y: H - 8 }); d0.textContent = fmtDate(pts[0].t, false); ax.append(d0);
    if (pts.length > 1) { const d1 = svg('text', { x: W - R, y: H - 8, 'text-anchor': 'end' }); d1.textContent = fmtDate(pts[pts.length - 1].t, false); ax.append(d1); }
    root.append(g, ax);
    if (pts.length > 1) root.append(svg('path', { class: 'series', d: pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.sc).toFixed(1)}`).join(' ') }));
    const best = Math.max(...pts.map((p) => p.sc));
    const ch = svg('line', { class: 'crosshair', y1: T, y2: H - B, visibility: 'hidden' }); root.append(ch);
    pts.forEach((p) => {
      const c = svg('circle', { class: 'dot' + (p.sc === best ? ' pb' : ''), cx: X(p.t), cy: Y(p.sc), r: 4 });
      const hit = svg('circle', { cx: X(p.t), cy: Y(p.sc), r: 12, fill: 'transparent' });
      hit.onmousemove = (e) => { ch.setAttribute('x1', X(p.t)); ch.setAttribute('x2', X(p.t)); ch.setAttribute('visibility', 'visible'); showTip(e, `<b>${fmtScore(p.sc)}</b><br>${fmtDate(p.t)}${p.sc === best ? ' ★ ベスト' : ''}`); };
      hit.onmouseleave = () => { ch.setAttribute('visibility', 'hidden'); hideTip(); };
      root.append(c, hit);
    });
    const lb = svg('text', { x: X(pts.findIndex((p) => p.sc === best) >= 0 ? pts.find((p) => p.sc === best).t : t1), y: Y(best) - 9, 'text-anchor': 'middle', fill: '#ffc64b', 'font-size': 11 }); lb.textContent = fmtScore(best); root.append(lb);
    return root;
  }

  function drawSong() {
    const s = songs.find((x) => x.song_id === cur);
    if (!s) { $('trend').replaceChildren(el('div', { class: 'mute' }, 'まだ記録がありません')); return; }
    $('trend').replaceChildren(trendChart(s));
    const w = D.weak[cur];
    $('heat').replaceChildren(); $('weak').replaceChildren();
    if (!w || !w.all.length) { $('weak').append(el('li', { class: 'mute' }, 'データなし')); return; }
    const byPage = new Map(w.all.map((p) => [p.page, p]));
    for (let pg = 0; pg < w.n_pages; pg++) {
      const p = byPage.get(pg);
      const a = p ? p.acc : null;
      const c = el('i', { style: a == null ? '' : `background:${heatColor(a)}` });
      if (p) { c.onmousemove = (e) => showTip(e, `区間 ${pg + 1} · ${fmtT(p.t_start)}–${fmtT(p.t_end)}<br><b>${Math.round(a * 100)}%</b> (${p.n_notes}音)`); c.onmouseleave = hideTip; }
      $('heat').append(c);
    }
    $('weak').replaceChildren(...w.pages.slice(0, 5).map((p) => el('li', {}, el('span', { class: 'pct', style: `color:${heatColor(p.acc)}` }, Math.round(p.acc * 100) + '%'), el('span', {}, `区間 ${p.page + 1}`, el('span', { class: 'dim' }, ` ${fmtT(p.t_start)}–${fmtT(p.t_end)}`)), el('a', { href: `/play?song=${cur}`, class: 'dim', style: 'margin-left:auto;font-size:12px' }, '練習する →'))));
  }
  const fmtT = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  // sequential single-hue ramp (cyan): dark = weak, bright = strong
  function heatColor(a) { const stops = ['#0f2a33', '#145c6a', '#1a7a8c', '#1f93aa', '#2ab6cf', '#35d6f0']; return stops[Math.min(5, Math.floor(a * 6))]; }

  // --- by-note bar chart ---
  function noteChart(notes) {
    const W = 900, H = 240, L = 40, R = 10, T = 16, B = 46;
    const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '音ごとの命中率' });
    const n = notes.length, bw = (W - L - R) / n;
    const Y = (v) => T + (1 - v) * (H - T - B);
    const g = svg('g', { class: 'grid' }), ax = svg('g', { class: 'axis' });
    for (const v of [0, .25, .5, .75, 1]) { g.append(svg('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v) })); const t = svg('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = Math.round(v * 100) + '%'; ax.append(t); }
    root.append(g, ax);
    const maxN = Math.max(...notes.map((x) => x.n));
    notes.forEach((x, i) => {
      const cx = L + bw * i + bw / 2, w = Math.max(3, Math.min(bw - 3, 22));
      const bar = svg('rect', { class: 'bar', x: cx - w / 2, y: Y(x.hit_rate), width: w, height: Math.max(0, Y(0) - Y(x.hit_rate)), rx: 3, opacity: 0.55 + 0.45 * Math.sqrt(x.n / maxN) });
      const lbl = svg('text', { x: cx, y: H - B + 14, 'text-anchor': 'middle', fill: x.midi % 12 === 0 ? '#eef2ff' : '#8b93b8', 'font-size': n > 24 ? 9 : 11 }); lbl.textContent = x.name;
      root.append(bar, lbl);
      if (x.cents != null && Math.abs(x.cents) >= 15) { const a = svg('text', { x: cx, y: H - B + 28, 'text-anchor': 'middle', fill: x.cents > 0 ? '#ff4d8f' : '#ffc64b', 'font-size': 12 }); a.textContent = x.cents > 0 ? '↑' : '↓'; root.append(a); }
      const hit = svg('rect', { x: L + bw * i, y: T, width: bw, height: H - T - B, fill: 'transparent' });
      hit.onmousemove = (e) => showTip(e, `${x.name}（${x.name_jp}）<br><b>${Math.round(x.hit_rate * 100)}%</b> 命中 · ${x.n}回<br>${x.cents == null ? '' : (x.cents > 0 ? `+${x.cents}` : x.cents) + ' cents ' + (x.cents > 15 ? '高め↑' : x.cents < -15 ? '低め↓' : 'ちょうど')}`);
      hit.onmouseleave = hideTip;
      root.append(hit);
    });
    const cap = svg('text', { x: W - R, y: H - 4, 'text-anchor': 'end', fill: '#5b6488', 'font-size': 10 }); cap.textContent = '棒の濃さ＝出てきた回数'; root.append(cap);
    return root;
  }
  $('notes').replaceChildren(D.by_note.length ? noteChart(D.by_note) : el('div', { class: 'mute' }, 'まだデータがありません'));

  // --- recent table ---
  const t = $('recent');
  t.replaceChildren(el('tr', {}, el('th', {}, '曲'), el('th', { class: 'num' }, '点数'), el('th', { class: 'num' }, 'P / G / G / M'), el('th', { class: 'num' }, 'combo'), el('th', {}, 'いつ')),
    ...D.recent.map((p) => el('tr', {}, el('td', {}, el('a', { href: `/play?song=${p.song_id}` }, p.title_jp)), el('td', { class: 'num sc' }, fmtScore(p.score)),
      el('td', { class: 'num dim' }, `${p.n_perfect} / ${p.n_great} / ${p.n_good} / ${p.n_miss}`), el('td', { class: 'num led' }, p.max_combo), el('td', { class: 'dim', title: fmtDate(p.played_at) }, fmtAgo(p.played_at)))));
  if (!D.recent.length) t.append(el('tr', {}, el('td', { colspan: 5, class: 'mute' }, 'まだ記録がありません。', el('a', { href: '/' }, '1曲うたってみる →'))));
  tabs(); drawSong();
</script>
</body>
</html>
