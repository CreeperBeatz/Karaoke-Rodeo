<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラオケ.ロデオ — ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<style>
  .box { max-width: 420px; margin: 8vh auto 0; }
  .box .logo { font-size: 30px; display: block; text-align: center; margin-bottom: 22px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=email] { font-size: 16px; padding: 12px 14px; }
  .devlink { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<header class="top"></header>
<main class="page">
  <div class="box panel">
    <span class="logo" title="karaoke.rodeo">カラオケ<em>.</em>ロデオ</span>
    <h2>メールでログイン <span class="sub">magic link</span></h2>
    <p class="dim" style="line-height:1.6">メールアドレスを入れると、ログイン用のリンクを送ります。パスワードはありません。初めての方もこれで登録できます。</p>
    <form id="f">
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" autofocus>
      <button class="primary" id="btn" type="submit">リンクを送る <span class="sub">send link</span></button>
    </form>
    <div id="out" class="stack" style="margin-top:14px"></div>
  </div>
</main>
<script type="module">
  import { api, renderNav, el, $, getMe, qs } from '/static/common.js';
  await renderNav('/login');
  const next = qs('next') || '/';
  if (await getMe()) location.replace(next);
  if (qs('error')) $('out').append(el('div', { class: 'msg err' }, 'このリンクは無効か期限切れです。もう一度送ってください。'));
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    $('btn').disabled = true;
    $('out').replaceChildren();
    try {
      const r = await api('/api/auth/request', { method: 'POST', body: { email: $('email').value, next } });
      $('out').append(el('div', { class: 'msg ok' }, `送りました。${$('email').value} のメールを確認してください（15分有効）。`));
      if (r.dev_link) $('out').append(el('div', { class: 'msg' }, el('b', {}, 'DEV MODE: '), 'メールは送っていません。このリンクでログイン → ', el('a', { class: 'devlink', href: r.dev_link }, r.dev_link)));
    } catch (err) {
      $('out').append(el('div', { class: 'msg err' }, err.message));
      $('btn').disabled = false;
    }
  };
</script>
</body>
</html>
