<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラオケ.ロデオ — うたう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0b0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カラオケ.ロデオ">
<link rel="stylesheet" href="/static/common.css">
<style>
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .hero h1 { font-size: 26px; }
  .welcome { background: linear-gradient(135deg, #1a2340, #131a2e); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; margin-bottom: 20px; }
  .welcome p { color: var(--ink-dim); line-height: 1.7; max-width: 640px; }
  .recent li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .recent li:last-child { border-bottom: none; }
  .recent .s { margin-left: auto; font-family: var(--font-led); color: var(--gold); font-size: 16px; }
  .recent ul { list-style: none; margin: 0; padding: 0; }
  .two { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"></header>
<main class="page">
  <div id="welcome" class="welcome" hidden>
    <h1 class="logo" style="font-size:30px" title="karaoke.rodeo">カラオケ<em>.</em>ロデオ</h1>
    <p>カラオケ@DIVA の練習動画で、家でひとり採点カラオケ。マイクの音程を音符バーと比べて、カラオケ機みたいに点数が出ます。
      ログインすると点数の履歴・上達グラフ・ランキングが残ります。</p>
    <a href="/login"><button class="primary">ログイン / はじめる <span class="sub">sign in</span></button></a>
  </div>
  <div class="hero">
    <div><h1>曲をえらぶ <span class="sub">choose a song</span></h1></div>
    <div class="row">
      <input id="q" type="text" placeholder="曲名・アーティストで検索" style="min-width:240px">
      <button id="partyBtn" class="ghost" hidden>🎉 パーティーを始める <span class="sub">start a party</span></button>
    </div>
  </div>
  <div class="two">
    <div id="songs" class="grid cards"></div>
    <aside class="panel recent">
      <h3>みんなの最近 <span class="sub">recent</span></h3>
      <ul id="recent"></ul>
    </aside>
  </div>
</main>
<footer class="foot">カラオケ.ロデオ · karaoke.rodeo</footer>
<script type="module">
  import { api, renderNav, el, esc, avatarEl, fmtScore, fmtAgo, fmtDur, toast, $ } from '/static/common.js';
  import { onParty, startParty } from '/static/party.js';
  const me = await renderNav('/');
  if (!me) $('welcome').hidden = false;

  // Party mode is started here and only here; while it runs, the strip under the header carries it.
  if (me) {
    $('partyBtn').hidden = false;
    onParty((p) => {
      $('partyBtn').disabled = !!p;
      $('partyBtn').textContent = p ? `🎉 パーティー中 ${p.code}` : '🎉 パーティーを始める';
    });
    $('partyBtn').onclick = async () => {
      $('partyBtn').disabled = true;
      try { await startParty(); toast('パーティーを始めました。スマホでQRを読んで参加してもらおう。', 'ok'); }
      catch (e) { toast(e.message, 'err'); $('partyBtn').disabled = false; }
    };
  }
  const [{ songs }, lb] = await Promise.all([api('/api/songs'), api('/api/leaderboard').catch(() => ({ recent: [] }))]);

  function card(s) {
    const thumb = el('div', { class: 'thumb' });
    if (s.has_thumb) thumb.append(el('img', { src: `/api/songs/${s.id}/thumb`, alt: '' }));
    if (s.my_best != null) thumb.append(el('div', { class: 'best' }, fmtScore(s.my_best)));
    const top = s.top && s.top[0];
    return el('a', { class: 'song', href: me ? `/play?song=${encodeURIComponent(s.id)}` : '/login?next=' + encodeURIComponent(`/play?song=${s.id}`) },
      thumb,
      el('div', { class: 'body' },
        el('div', { class: 'title' }, s.title_jp || s.title_en || s.id),
        el('div', { class: 'artist' }, s.artist_jp || s.artist_en || ''),
        el('div', { class: 'meta' },
          el('span', {}, `${s.n_notes ?? '?'}音 · ${fmtDur(s.duration)}` + (s.my_plays ? ` · ${s.my_plays}回` : '')),
          top ? el('span', { class: 'top', title: `1位 ${top.display_name}` }, avatarEl(top), el('span', { class: 'led gold' }, fmtScore(top.best))) : el('span', { class: 'mute' }, 'まだ記録なし'))));
  }
  function render(filter = '') {
    const f = filter.trim().toLowerCase();
    const list = songs.filter((s) => !f || [s.title_jp, s.artist_jp, s.title_en, s.artist_en].some((x) => (x || '').toLowerCase().includes(f)));
    $('songs').replaceChildren(...list.map(card));
    if (!list.length) $('songs').append(el('div', { class: 'panel dim' }, songs.length ? '見つかりません' : 'まだ曲がありません。管理画面から追加してください。'));
  }
  render();
  $('q').oninput = () => render($('q').value);
  $('recent').replaceChildren(...(lb.recent || []).slice(0, 12).map((r) =>
    el('li', {}, avatarEl(r), el('span', {}, el('b', {}, r.display_name), ' ', el('span', { class: 'dim' }, r.title_jp), el('br'), el('small', { class: 'mute' }, fmtAgo(r.played_at))),
      el('span', { class: 's' }, fmtScore(r.score)))));
  if (!(lb.recent || []).length) $('recent').append(el('li', { class: 'mute' }, 'まだ誰もうたっていません'));
</script>
</body>
</html>
